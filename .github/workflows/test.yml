# Runs the kit's test suite, the Station's own checks (station/, Rust) and a gitleaks scan of the new commits on every
# push and pull request.
# Actions are pinned by commit SHA (the tag is in the comment); gitleaks is a pinned release whose
# checksum is verified before it runs.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest already has what the suite needs: bash, git, awk, python3, pgrep, flock, timeout.
      # The status HUD's TypeScript suite needs the claude CLI, which CI does not have, so run.sh skips it
      # and says so in the log (run it locally with: claude plugin test plugins/status-hud).
      - name: Run tests/run.sh
        shell: bash
        run: bash tests/run.sh

  # The Orcastration Station (station/): its own gate (privacy checks, fmt, clippy, tests, Windows cross-check). This is
  # the ONLY place Rust is built for the kit: no build runs on a maintainer's machine. Read-only token, no secrets, and
  # the third-party code (cargo crates, the Station's own build scripts) runs only inside this runner.
  station:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The two paths under the runner's temp dir are set by the first step (the `runner` context is not available in a
      # job-level env, and GitHub then refuses the whole file: "workflow file issue", no job starts).
      # Pinned: clippy runs with -D warnings, so an unpinned stable could turn CI red with no change in the kit. Raise it on purpose.
      RUST_VERSION: "1.100.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Paths under the runner's temp dir
        shell: bash
        run: |
          # scripts/env.sh points cargo at $OBSERVATORY_RUST_DIR/{rustup,cargo}; here those are links to the runner's own.
          echo "OBSERVATORY_RUST_DIR=$RUNNER_TEMP/station-rust" >> "$GITHUB_ENV"
          # Outside the rust dir, so env.sh respects it, and one fixed path for the cache.
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/station-target" >> "$GITHUB_ENV"
      - name: Toolchain (rustup on the runner), Windows target, software Vulkan for the snapshot tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-gnu
          rustup default "$RUST_VERSION"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 bc
          mkdir -p "$OBSERVATORY_RUST_DIR"
          ln -s "$HOME/.rustup" "$OBSERVATORY_RUST_DIR/rustup"
          ln -s "$HOME/.cargo" "$OBSERVATORY_RUST_DIR/cargo"
      - name: Cache cargo registry and the build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ${{ runner.temp }}/station-target
          key: station-${{ runner.os }}-${{ hashFiles('station/Cargo.lock') }}
          restore-keys: station-${{ runner.os }}-
      - name: Known-vulnerability check of the locked crates (cargo-audit, pinned; reads the RustSec advisory database)
        shell: bash
        run: |
          set -euo pipefail
          # The cache may hand back the binary without cargo's install records, and then `cargo install` refuses it: ask the
          # binary itself, and install only when it is missing or not this version.
          cargo audit --version 2>/dev/null | grep -qF '0.23.0' || cargo install cargo-audit --version 0.23.0 --locked --force
          cargo audit --file station/Cargo.lock
      - name: The Station gate (last line must be GATE PASS)
        shell: bash
        working-directory: station
        run: |
          set -o pipefail
          bash scripts/gate.sh 2>&1 | tee "$RUNNER_TEMP/station-gate.log"
          tail -n 1 "$RUNNER_TEMP/station-gate.log" | grep -qE '^GATE PASS \([0-9]+ tests\)$'

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff range needs the base commit
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      # With gitleaks on PATH, the leak guard also runs its parity case through the real binary, so the guard and
      # .gitleaks.toml are checked against each other on every push (the test job has no gitleaks and skips that case).
      - name: Leak guard, with the gitleaks parity case
        shell: bash
        run: bash tests/leak-guard.test.sh
      - name: Scan the new commits
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$SHA"
          elif git rev-parse -q --verify refs/remotes/origin/main >/dev/null && [ "$GITHUB_REF" != refs/heads/main ]; then
            range="$SHA --not origin/main" # a new branch, or a force push: the commits main does not have
          else
            range="$SHA" # no base to compare with: scan the whole history
          fi
          echo "scanning: $range"
          gitleaks git . --config .gitleaks.toml --log-opts="$range" --redact --no-banner --verbose
