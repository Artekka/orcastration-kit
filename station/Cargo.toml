[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.1"

[workspace.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "links", "wayland", "x11"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false }
# Not called directly: eframe's `links` feature opens URLs through webbrowser (via egui-winit).
# Naming it here turns on `hardened` for that same copy (Cargo unifies features), so the
# browser crate itself refuses every URL that is not http or https. The app's own check
# (markdown.rs link_target) stays the first line; this is the second.
webbrowser = { version = "1.2.7", features = ["hardened"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG / JPEG / WebP only (chat thumbnails). No other formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
notify = { version = "8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
